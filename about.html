<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Travels</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
         .about-section {
            text-align: center;
            width: 70%;
            margin: 50px auto;
        }

        .about-section p {
            color: #555;
            font-size: 16px;
        }

        /* Meet Our Team Section */
        .team-container {
            width: 85%;
            margin: 0 auto 50px auto;
            background: #fff;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .team-title {
            font-size: 24px;
            font-weight: bold;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            text-align: center;
        }

        .team-member img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
        }

        .team-member p {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }
    </style>
    <html>
    <body>
         <!-- About Us Section -->
    <div class="about-section">
        <h2>About Us</h2>
        <p>Our company is dedicated to providing the best travel experiences to our customers. We specialize in creating custom itineraries that cater to each individual's interests and preferences.</p>
    </div>

    <!-- Meet Our Team -->
    <div class="team-container">
        <div class="team-title text-center mb-4">Meet Our Team</div>
        <div class="team-grid">
            <div class="team-member">
                <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a" alt="John Smith">
                <h5 class="mt-2 mb-0" style="font-size: 18px; font-weight: bold;">John Smith</h5>
                <p>Founder & CEO</p>
            </div>
            <div class="team-member">
                <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2" alt="Jane Doe">
                <h5 class="mt-2 mb-0" style="font-size: 18px; font-weight: bold;">Jane Doe</h5>
                <p>Head of Operations</p>
            </div>
            <div class="team-member">
                <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7" alt="David Lee">
                <h5 class="mt-2 mb-0" style="font-size: 18px; font-weight: bold;">David Lee</h5>
                <p>Marketing Director</p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    </body>
    </html>
