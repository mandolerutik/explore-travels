<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Travels</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(to right, #1140d8, #4776e6);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-container {
    background: white;
    width: 400px;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
}

.login-container h1 {
    text-align: center;
    color: #1140d8;
    font-size: 30px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
}

form label {
    display: block;
    font-size: 15px;
    margin-bottom: 8px;
    color: #333;
}

form input[type="email"],
form input[type="password"] {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
    outline: none;
}

form input:focus {
    border-color: #1140d8;
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    font-size: 13px;
}

.options .remember {
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 0;
}

.options a {
    color: #1140d8;
    text-decoration: none;
}

button {
    width: 100%;
    padding: 13px;
    background: #1140d8;
    color: white;
    border: none;
    border-radius: 25px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #082ca5;
}

.signup {
    text-align: center;
    margin-top: 25px;
    font-size: 14px;
    color: #555;
}

.signup a {
    color: #1140d8;
    text-decoration: none;
    font-weight: bold;
}

.signup a:hover,
.options a:hover {
    text-decoration: underline;
}

@media (max-width: 450px) {
    .login-container {
        width: 90%;
        padding: 25px;
    }
}
    </style>

<body>

    <div class="login-container">

        <h1>Welcome Back!</h1>
        <p class="subtitle">Login to your account</p>

        <form>
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" placeholder="Enter your password" required>

            <div class="options">
                <label class="remember">
                    <input type="checkbox"> Remember me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>
        </form>

        <p class="signup">
            Don't have an account?
            <a href="#">Sign Up</a>
        </p>

    </div>

</body>
</html>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    </body>
    </html>
