<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Travels</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
         .contact {
            width: 70%;
            margin: 60px auto;
            text-align: center;
        }

        .contact h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .contact p {
            color: #555;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .info {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 35px;
            flex-wrap: wrap;
            font-size: 17px;
        }

        form input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        form textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: none;
            font-size: 16px;
        }

        button {
            margin-top: 25px;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(to right, #ff9966, #ff5e62);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Footer */
        footer {
            background: #222;
            color: #fff;
            text-align: center;
            padding: 30px 0;
            margin-top: 50px;
        }

    </style>
    <html>
    <body>
           <div class="contact">
        <h1>Contact Us</h1>
        <p>If you have any questions or would like to book a trip, please fill out the form below or contact us using the information provided.</p>
        <div class="info">
            <span>📍 123 Main St, Anytown USA</span>
            <span>✉️ info@travelcompany.com</span>
            <span>📞 555-123-4587</span>
        </div>
        <form>
            <input type="text" placeholder="Enter your name">
            <input type="email" placeholder="Enter your email">
            <textarea placeholder="Message"></textarea>
            <button type="submit">Send Message</button>
        </form>
        
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    </body>
    </html>
